[package]
name = "hm-plugin-cloud"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in cloud client plugin for the hm CLI."
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
hm-plugin-sdk      = { workspace = true }
hm-plugin-protocol = { workspace = true }
stabby             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
semver             = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
clap               = { version = "4", features = ["derive"] }
anyhow             = "1"
url                = "2"
base64             = "0.22"
sha2               = "0.10"
reqwest            = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio              = { workspace = true }
axum               = { version = "0.7", default-features = false, features = ["tokio", "http1", "query"] }
webbrowser         = "1"
dialoguer          = "0.11"
toml               = "0.8"
dirs               = "6"
rand               = "0.8"

[lints]
workspace = true
